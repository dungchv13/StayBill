services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staybill
      POSTGRES_USER: staybill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staybill}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15432:5432"
    volumes:
      - staybill_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staybill -d staybill"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staybill_pg:
