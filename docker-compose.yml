services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staybill
      POSTGRES_USER: staybill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staybill}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "15432:5432"
    volumes:
      - staybill_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staybill -d staybill"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=staybill;Username=staybill;Password=${POSTGRES_PASSWORD:-staybill}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Key: ${Jwt__Key:-staybill-dev-key-change-me-32chars-min}
      Jwt__Issuer: ${Jwt__Issuer:-StayBill}
      Jwt__Audience: ${Jwt__Audience:-StayBill}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  staybill_pg:
